name: 电费每日推送

on:
  schedule:
    # UTC 02:00 -> 北京时间 10:00
    - cron: '0 2 * * *'
  workflow_dispatch:   # 手动测试按钮

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 运行脚本
        env:
          SCKEY: ${{ secrets.SCKEY }}
        run: python electricity_monitor.py